name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      - name: Download libcomm14cux Source
        run: |
          Write-Host "Downloading libcomm14cux source..."
          $url = "https://github.com/colinbourassa/libcomm14cux/archive/refs/tags/2.1.3.zip"
          Invoke-WebRequest -Uri $url -OutFile "libcomm_src.zip"
          Expand-Archive -Path "libcomm_src.zip" -DestinationPath "libcomm_src" -Force
          Move-Item -Path "libcomm_src/libcomm14cux-2.1.3" -Destination "libcomm_src_clean" -Force
        shell: pwsh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare Library Sources
        run: |
          Write-Host "Preparing library sources for direct compilation..."
          
          # 1. Патч: Убираем unistd.h
          $files = Get-ChildItem -Path "libcomm_src_clean" -Recurse -Include "*.c","*.h"
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            if ($content -match '#include\s*<unistd\.h>') {
              $content = $content -replace '#include\s*<unistd\.h>', '// #include <unistd.h>'
              Set-Content -Path $file.FullName -Value $content -NoNewline
            }
          }

          # 2. Копируем исходники библиотеки (.c и .h) прямо в папку src основного проекта
          # Это заставит компилятор собрать их вместе с программой rovergauge
          Copy-Item "libcomm_src_clean/src/*.c" -Destination "src/" -Force
          Copy-Item "libcomm_src_clean/src/*.h" -Destination "src/" -Force
          
          Write-Host "Library sources copied to src/ folder."
          Write-Host "Files in src:"
          Get-ChildItem "src/" -Filter "*.c"
        shell: pwsh

      - name: Configure Rovergauge
        run: |
          Write-Host "Configuring main project..."
          # Теперь нам не нужен отдельный .lib файл, так как исходники библиотеки 
          # лежат в папке src и будут скомпилированы вместе с основным кодом.
          # Но нам нужно убедиться, что CMakeLists.txt основного проекта их подхватит.
          # Если он использует find_library, это может не сработать автоматически.
          # Поэтому мы просто собираем проект. Если CMakeLists.txt жестко требует .lib,
          # нам придется его слегка подправить (закомментировать find_library).
          
          # Попытка стандартной конфигурации
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"
        shell: pwsh
          
      - name: Build Rovergauge
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
