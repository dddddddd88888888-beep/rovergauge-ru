name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      # 1. Скачиваем библиотеку libcomm14cux
      - name: Checkout libcomm14cux
        uses: actions/checkout@v4
        with:
          repository: colinbourassa/libcomm14cux
          path: temp_libcomm

      # 2. Копируем файлы библиотеки ВНУТРЬ проекта, чтобы компилятор их точно увидел
      - name: Copy libcomm14cux headers to src
        run: |
          Write-Host "Copying libcomm14cux files..."
          
          $srcPath = "temp_libcomm/src"
          $destPath = "src" # Папка src основного проекта
          
          # Проверяем, где лежат заголовки в скачанной библиотеке
          if (Test-Path "$srcPath/comm14cux.h") {
              Copy-Item "$srcPath/*.h" -Destination $destPath -Force
              Copy-Item "$srcPath/*.cpp" -Destination $destPath -Force # Копируем и исходники, если нужно
              Write-Host "Headers copied from temp_libcomm/src to src"
          } elseif (Test-Path "temp_libcomm/comm14cux.h") {
              Copy-Item "temp_libcomm/*.h" -Destination $destPath -Force
              Write-Host "Headers copied from temp_libcomm root to src"
          } else {
              Write-Error "comm14cux.h not found in temp_libcomm!"
              Get-ChildItem -Recurse temp_libcomm -Filter "*.h"
              exit 1
          }
          
          # Копируем библиотеку (.lib/.dll) в корень для удобства линковки
          if (Test-Path "temp_libcomm/Release/libcomm14cux.lib") {
              Copy-Item "temp_libcomm/Release/*" -Destination "." -Force
              Write-Host "Library files copied to root"
          }
        shell: pwsh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          Write-Host "Configuring CMake..."
          # Теперь заголовки лежат прямо в папке src проекта, 
          # поэтому CMake найдет их автоматически через include_directories в CMakeLists.txt
          
          cmake -B build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"
        shell: pwsh
          
      - name: Build Project
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
          # Копируем DLL библиотеки рядом с exe, если она есть
          if (Test-Path "libcomm14cux.dll") { Copy-Item "libcomm14cux.dll" "build/Release/" }
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
