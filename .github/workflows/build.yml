name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4
        with:
          submodules: 'false' # Мы скачаем библиотеку отдельно следующим шагом

      # --- НОВЫЙ ШАГ: Скачивание библиотеки libcomm14cux ---
      - name: Checkout libcomm14cux
        uses: actions/checkout@v4
        with:
          repository: colinbourassa/libcomm14cux
          path: libcomm14cux # Скачиваем в папку libcomm14cux в корне проекта
          
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          Write-Host "VSINSTALLDIR: $env:VSINSTALLDIR"
          Write-Host "Qt5_DIR: $env:Qt5_DIR"
          Write-Host "Current Directory: $(Get-Location)"
          
          # Проверяем, что библиотека скачалась
          if (Test-Path "libcomm14cux") {
            Write-Host "libcomm14cux found!"
            # Указываем CMake искать библиотеки и в папке Qt, и в папке libcomm14cux
            $cmake_prefix = "$env:Qt5_DIR;${{ github.workspace }}/libcomm14cux"
          } else {
            Write-Error "libcomm14cux NOT found!"
            exit 1
          }
          
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$cmake_prefix"
        shell: pwsh
          
      - name: Build Project
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
