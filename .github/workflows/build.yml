name: Build Rovergauge EXE

on:
  workflow_dispatch:  # Позволяет запускать сборку вручную кнопкой
  push:               # Или автоматически при любом изменении кода

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -DCMAKE_PREFIX_PATH="C:\Qt\5.15.2\msvc2019_64"
          
      - name: Build Project
        run: |
          cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          C:\Qt\5.15.2\msvc2019_64\bin\windeployqt.exe --release build\Release\rovergauge.exe
          
      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: rovergauge-built
          path: build/Release/   
