name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      # 1. Скачивание исходников библиотеки
      - name: Download libcomm14cux Source
        run: |
          Write-Host "Downloading libcomm14cux source..."
          $url = "https://github.com/colinbourassa/libcomm14cux/archive/refs/tags/2.1.3.zip"
          Invoke-WebRequest -Uri $url -OutFile "libcomm_src.zip"
          Expand-Archive -Path "libcomm_src.zip" -DestinationPath "libcomm_src" -Force
          
          # Переименовываем папку для удобства
          Move-Item -Path "libcomm_src/libcomm14cux-2.1.3" -Destination "libcomm_src_clean" -Force
          Write-Host "Source downloaded."
        shell: pwsh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      # 2. Сборка библиотеки из исходников с патчем для Windows
      - name: Build libcomm14cux from Source
        run: |
          Write-Host "Building libcomm14cux from source..."
          
          # Патчим файлы: убираем unistd.h, которого нет в Windows
          $files = Get-ChildItem -Path "libcomm_src_clean" -Recurse -Include "*.c","*.h"
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            if ($content -match '#include\s*<unistd\.h>') {
              Write-Host "Patching unistd.h in $($file.Name)..."
              $content = $content -replace '#include\s*<unistd\.h>', '// #include <unistd.h> // Removed for Windows'
              Set-Content -Path $file.FullName -Value $content -NoNewline
            }
          }

          # Устанавливаем переменную окружения для CMake (исправление ошибки версии)
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"

          # Конфигурируем и собираем
          cmake -B libcomm_build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -S libcomm_src_clean
            
          # Сбрасываем переменную
          Remove-Item Env:\CMAKE_POLICY_VERSION_MINIMUM -ErrorAction SilentlyContinue

          cmake --build libcomm_build --config Release
          
          # Копируем результат
          $libFile = Get-ChildItem -Path "libcomm_build" -Recurse -Filter "*.lib" | Select-Object -First 1
          $dllFile = Get-ChildItem -Path "libcomm_build" -Recurse -Filter "*.dll" | Select-Object -First 1
          
          if ($libFile) {
            Copy-Item $libFile.FullName -Destination "comm14cux.lib" -Force
            Write-Host "SUCCESS: comm14cux.lib created."
          } else {
            Write-Error "Failed to build .lib file!"
            exit 1
          }
          
          if ($dllFile) {
            Copy-Item $dllFile.FullName -Destination "comm14cux.dll" -Force
          }
        shell: pwsh

      # 3. Копирование заголовков в проект
      - name: Copy Headers to Main Project
        run: |
          if (Test-Path "libcomm_src_clean/include/*.h") {
            Copy-Item "libcomm_src_clean/include/*.h" -Destination "src" -Force
          } elseif (Test-Path "libcomm_src_clean/src/*.h") {
            Copy-Item "libcomm_src_clean/src/*.h" -Destination "src" -Force
          }
        shell: pwsh

      # 4. Сборка основной программы
      - name: Configure Rovergauge
        run: |
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR;${{ github.workspace }}"
        shell: pwsh
          
      - name: Build Rovergauge
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
          if (Test-Path "comm14cux.dll") { Copy-Item "comm14cux.dll" "build/Release/" }
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
