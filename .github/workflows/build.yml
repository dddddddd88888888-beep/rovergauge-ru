name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      - name: Download libcomm14cux Source
        run: |
          Write-Host "Downloading libcomm14cux source..."
          $url = "https://github.com/colinbourassa/libcomm14cux/archive/refs/tags/2.1.3.zip"
          Invoke-WebRequest -Uri $url -OutFile "libcomm_src.zip"
          Expand-Archive -Path "libcomm_src.zip" -DestinationPath "libcomm_src" -Force
          Move-Item -Path "libcomm_src/libcomm14cux-2.1.3" -Destination "libcomm_src_clean" -Force
        shell: pwsh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Patch and Build libcomm14cux
        run: |
          Write-Host "Patching and building libcomm14cux..."
          
          # 1. Патч: Убираем unistd.h
          $files = Get-ChildItem -Path "libcomm_src_clean" -Recurse -Include "*.c","*.h"
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            if ($content -match '#include\s*<unistd\.h>') {
              $content = $content -replace '#include\s*<unistd\.h>', '// #include <unistd.h>'
              Set-Content -Path $file.FullName -Value $content -NoNewline
            }
          }

          # 2. Патч: Убираем библиотеку 'm' и флаги MinGW
          $cmakeFile = "libcomm_src_clean/CMakeLists.txt"
          $content = Get-Content $cmakeFile -Raw
          if ($content -match 'target_link_libraries.*\bm\b') {
             $content = $content -replace '(target_link_libraries\s*\([^)]*)\s+\bm\b\s+', '$1 '
             $content = $content -replace '(target_link_libraries\s*\([^)]*)\s+\bm\b\s*\)', '$1)'
             Set-Content -Path $cmakeFile -Value $content -NoNewline
          }
          if ($content -match '-static-libgcc') {
             $content = $content -replace '\s-static-libgcc\s*', ' '
             Set-Content -Path $cmakeFile -Value $content -NoNewline
          }
          Set-Content -Path $cmakeFile -Value $content -NoNewline

          # 3. Сборка
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"
          cmake -B libcomm_build -G "Visual Studio 18 2026" -A x64 -S libcomm_src_clean
          Remove-Item Env:\CMAKE_POLICY_VERSION_MINIMUM -ErrorAction SilentlyContinue

          # Собираем ТОЛЬКО библиотеку
          cmake --build libcomm_build --config Release --target comm14cux
          
          # 4. Поиск и создание .lib файла
          $buildReleasePath = "libcomm_build/Release"
          $dllFile = Get-ChildItem -Path $buildReleasePath -Filter "comm14cux.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          $libFile = Get-ChildItem -Path $buildReleasePath -Filter "*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if ($libFile) {
              Copy-Item $libFile.FullName -Destination "comm14cux.lib" -Force
              Write-Host "Found existing .lib file: $($libFile.Name)"
          } elseif ($dllFile) {
              Write-Host "No .lib found, generating from DLL $($dllFile.Name)..."
              
              # Копируем DLL во временную папку для работы
              Copy-Item $dllFile.FullName -Destination "temp_gen.dll" -Force
              
              # Получаем список экспортируемых функций
              dumpbin /exports temp_gen.dll > exports.txt
              
              # Создаем .def файл
              "LIBRARY temp_gen.dll" | Out-File -FilePath "temp.def" -Encoding ASCII
              "EXPORTS" | Out-File -FilePath "temp.def" -Append -Encoding ASCII
              
              # Парсим вывод dumpbin и добавляем имена функций
              # Ищем строки с номерами экспорта (обычно начинаются с пробелов и цифры)
              Get-Content exports.txt | Select-String "^\s+[0-9]+" | ForEach-Object {
                  $parts = $_.Line -split '\s+'
                  # Имя функции обычно в 4-й колонке (индекс 3)
                  if ($parts.Count -ge 4) {
                      $funcName = $parts[3]
                      # Убираем декорацию имени (например, @12 в конце)
                      $cleanName = $funcName.Split('@')[0]
                      "    $cleanName" | Out-File -FilePath "temp.def" -Append -Encoding ASCII
                  }
              }
              
              Write-Host "Generated DEF file content:"
              Get-Content temp.def
              
              # Генерируем .lib файл
              lib /machine:x64 /def:temp.def /out:comm14cux.lib
              
              # Убираем временные файлы
              Remove-Item temp_gen.dll, temp.def, exports.txt -ErrorAction SilentlyContinue
              
              if (Test-Path "comm14cux.lib") {
                  Write-Host "SUCCESS: Generated comm14cux.lib from DLL."
              } else {
                  Write-Error "Failed to generate .lib file!"
                  exit 1
              }
          } else {
              Write-Error "CRITICAL: Neither .lib nor .dll file found in $buildReleasePath!"
              exit 1
          }
          
          # Копируем DLL для рантайма
          if ($dllFile) {
              Copy-Item $dllFile.FullName -Destination "comm14cux.dll" -Force
          }
        shell: pwsh

      - name: Copy Headers
        run: |
          if (Test-Path "libcomm_src_clean/include/*.h") {
            Copy-Item "libcomm_src_clean/include/*.h" -Destination "src" -Force
          } elseif (Test-Path "libcomm_src_clean/src/*.h") {
            Copy-Item "libcomm_src_clean/src/*.h" -Destination "src" -Force
          }
        shell: pwsh

      - name: Configure Rovergauge
        run: |
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR;${{ github.workspace }}"
        shell: pwsh
          
      - name: Build Rovergauge
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
          if (Test-Path "comm14cux.dll") { Copy-Item "comm14cux.dll" "build/Release/" }
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
