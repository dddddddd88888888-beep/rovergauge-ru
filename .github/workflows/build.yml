name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Rovergauge
        run: |
          Write-Host "=== Очистка кэша CMake ==="
          # Критически важный шаг: удаляем папку build, чтобы сбросить старую конфигурацию
          if (Test-Path "build") {
              Remove-Item -Recurse -Force "build"
              Write-Host "Папка build удалена. Кэш очищен."
          } else {
              Write-Host "Папка build не найдена, создаем новую конфигурацию."
          }
          
          Write-Host "Запуск конфигурации проекта..."
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"
        shell: pwsh
          
      - name: Build Rovergauge
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          Write-Host "Current PATH: $env:PATH"
          Write-Host "Qt5_DIR: $env:Qt5_DIR"
          
          # Пробуем запустить просто по имени, так как bin должен быть в PATH
          if (Get-Command windeployqt.exe -ErrorAction SilentlyContinue) {
              windeployqt.exe --release build/Release/rovergauge.exe
          } else {
              # Если нет в PATH, формируем путь вручную, поднимаясь из lib/cmake в bin
              # Путь обычно: .../Qt/5.15.2/msvc2019_64/lib/cmake -> .../Qt/5.15.2/msvc2019_64/bin
              $correctPath = "$env:Qt5_DIR\..\..\bin\windeployqt.exe"
              Write-Host "Falling back to: $correctPath"
              & $correctPath --release build/Release/rovergauge.exe
          }
        shell: pwsh   

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
