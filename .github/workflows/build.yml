name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      # 1. Скачиваем готовую библиотеку по вашей ссылке
      - name: Download libcomm14cux Binary
        run: |
          Write-Host "Downloading pre-built libcomm14cux..."
          $url = "https://github.com/colinbourassa/libcomm14cux/releases/download/2.1.3/libcomm14cux-2.1.3-Windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "libcomm.zip"
          Expand-Archive -Path "libcomm.zip" -DestinationPath "libcomm_bin" -Force
          
          # Проверяем структуру и копируем файлы
          # Обычно в архиве папки bin и lib
          if (Test-Path "libcomm_bin/bin/comm14cux.dll") {
             Copy-Item "libcomm_bin/bin/*" -Destination "." -Force
             Copy-Item "libcomm_bin/lib/*" -Destination "." -Force
             Write-Host "Files copied from bin/lib folders."
          } else {
             # Если файлы прямо в корне
             Copy-Item "libcomm_bin/*" -Destination "." -Force
             Write-Host "Files copied from root."
          }
          
          # Выводим список файлов для отладки
          Get-ChildItem "." -Filter "*.lib"
          Get-ChildItem "." -Filter "*.dll"
        shell: pwsh

      # 2. Скачиваем заголовочный файл (comm14cux.h) из исходников
      - name: Get Header File
        run: |
          git clone --depth 1 https://github.com/colinbourassa/libcomm14cux.git temp_src
          if (Test-Path "temp_src/src/comm14cux.h") {
            Copy-Item "temp_src/src/*.h" -Destination "src" -Force
            Write-Host "Header file copied to src/"
          }
          Remove-Item -Recurse -Force temp_src
        shell: pwsh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Rovergauge
        run: |
          Write-Host "Configuring main project..."
          # Файл .lib теперь лежит в корне, CMake найдет его через find_library
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"
        shell: pwsh
          
      - name: Build Rovergauge
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
          # Копируем DLL библиотеки в папку с программой
          if (Test-Path "comm14cux.dll") { Copy-Item "comm14cux.dll" "build/Release/" }
          if (Test-Path "libcomm14cux.dll") { Copy-Item "libcomm14cux.dll" "build/Release/" }
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
