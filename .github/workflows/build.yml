name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      - name: Checkout libcomm14cux
        uses: actions/checkout@v4
        with:
          repository: colinbourassa/libcomm14cux
          path: temp_libcomm

      - name: Copy Headers
        run: |
          if (Test-Path "temp_libcomm/src/comm14cux.h") {
            Copy-Item "temp_libcomm/src/*.h" -Destination "src" -Force
          } elseif (Test-Path "temp_libcomm/comm14cux.h") {
            Copy-Item "temp_libcomm/*.h" -Destination "src" -Force
          }
        shell: pwsh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build libcomm14cux
        run: |
          Write-Host "Building libcomm14cux library..."
          
          # 1. Создаем пустой файл README, если его нет (исправление ошибки configure_file)
          if (-not (Test-Path "temp_libcomm/README")) {
            New-Item -Path "temp_libcomm/README" -ItemType File -Force | Out-Null
            Write-Host "Created missing README file."
          }
          
          # 2. Запускаем CMake с корректным флагом политики (используем кавычки для значения)
          # Используем переменную окружения вместо аргумента командной строки, чтобы избежать проблем с парсингом
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"
          
          cmake -B temp_libcomm/build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -S temp_libcomm
            
          # Сбрасываем переменную
          Remove-Item Env:\CMAKE_POLICY_VERSION_MINIMUM -ErrorAction SilentlyContinue

          # 3. Собираем библиотеку
          cmake --build temp_libcomm/build --config Release
          
          # 4. Ищем и копируем .lib файл
          $libFound = $false
          $possibleNames = @("comm14cux.lib", "libcomm14cux.lib")
          
          foreach ($name in $possibleNames) {
            $path = "temp_libcomm/build/Release/$name"
            if (Test-Path $path) {
              Copy-Item $path -Destination "." -Force
              Write-Host "Found and copied: $name"
              $libFound = $true
              break
            }
          }
          
          if (-not $libFound) {
            Write-Error "Failed to find compiled .lib file!"
            Write-Host "Contents of Release folder:"
            Get-ChildItem "temp_libcomm/build/Release" -ErrorAction SilentlyContinue
            exit 1
          }
        shell: pwsh

      - name: Configure Rovergauge
        run: |
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"
        shell: pwsh
          
      - name: Build Rovergauge
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
          if (Test-Path "temp_libcomm/build/Release/comm14cux.dll") { Copy-Item "temp_libcomm/build/Release/comm14cux.dll" "build/Release/" }
          if (Test-Path "temp_libcomm/build/Release/libcomm14cux.dll") { Copy-Item "temp_libcomm/build/Release/libcomm14cux.dll" "build/Release/" }
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
