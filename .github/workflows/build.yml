name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      # Скачиваем библиотеку libcomm14cux в папку libcomm14cux
      - name: Checkout libcomm14cux
        uses: actions/checkout@v4
        with:
          repository: colinbourassa/libcomm14cux
          path: libcomm14cux
          
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          Write-Host "Configuring CMake..."
          
          # Формируем пути явно
          $qtPath = "$env:Qt5_DIR"
          $libcommPath = "${{ github.workspace }}/libcomm14cux"
          
          # Проверяем наличие заголовочного файла
          if (-not (Test-Path "$libcommPath/comm14cux.h")) {
             Write-Error "Файл comm14cux.h не найден в папке $libcommPath. Проверьте структуру репозитория libcomm14cux."
             exit 1
          }

          # Передаем пути через CMAKE_INCLUDE_PATH и CMAKE_LIBRARY_PATH для надежности
          cmake -B build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$qtPath;$libcommPath" `
            -DCMAKE_INCLUDE_PATH="$qtPath/include;$libcommPath" `
            -DCMAKE_LIBRARY_PATH="$qtPath/lib;$libcommPath"
        shell: pwsh
          
      - name: Build Project
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
