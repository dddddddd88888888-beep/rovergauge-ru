name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      # Явная инициализация среды разработчика VS2022
      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.3' # Явно указываем версию инструментария VS2022

      - name: Configure CMake
        run: |
          # Проверяем, видна ли среда MSVC
          if (-not $env:VSINSTALLDIR) {
            Write-Error "Visual Studio environment not loaded. VSINSTALLDIR is empty."
            exit 1
          }
          Write-Host "Using Visual Studio from: $env:VSINSTALLDIR"
          Write-Host "Qt5_DIR: $env:Qt5_DIR"
          
          # Добавляем -T host=x64 для явного указания 64-битной среды
          cmake -B build -G "Visual Studio 17 2022" -A x64 -T host=x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"
        shell: pwsh
          
      - name: Build Project
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error
