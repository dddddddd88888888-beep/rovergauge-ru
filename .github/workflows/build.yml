name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      - name: Checkout libcomm14cux
        uses: actions/checkout@v4
        with:
          repository: colinbourassa/libcomm14cux
          path: temp_libcomm

      - name: Copy Headers
        run: |
          if (Test-Path "temp_libcomm/src/comm14cux.h") {
            Copy-Item "temp_libcomm/src/*.h" -Destination "src" -Force
          } elseif (Test-Path "temp_libcomm/comm14cux.h") {
            Copy-Item "temp_libcomm/*.h" -Destination "src" -Force
          }
        shell: pwsh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      # --- ИСПРАВЛЕННЫЙ ШАГ СБОРКИ БИБЛИОТЕКИ ---
      - name: Build libcomm14cux
        run: |
          Write-Host "Building libcomm14cux library with updated CMake policy..."
          
          # Добавляем -DCMAKE_POLICY_VERSION_MINIMUM=3.5 для обхода ошибки совместимости
          cmake -B temp_libcomm/build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -S temp_libcomm `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            
          cmake --build temp_libcomm/build --config Release
          
          # Поиск и копирование .lib файла
          $libFound = $false
          if (Test-Path "temp_libcomm/build/Release/comm14cux.lib") {
             Copy-Item "temp_libcomm/build/Release/comm14cux.lib" -Destination "." -Force
             Write-Host "Found and copied comm14cux.lib"
             $libFound = $true
          } elseif (Test-Path "temp_libcomm/build/Release/libcomm14cux.lib") {
             Copy-Item "temp_libcomm/build/Release/libcomm14cux.lib" -Destination "." -Force
             Write-Host "Found and copied libcomm14cux.lib"
             $libFound = $true
          }
          
          if (-not $libFound) {
             Write-Error "Failed to find compiled .lib file!"
             Write-Host "Contents of Release folder:"
             Get-ChildItem "temp_libcomm/build/Release"
             exit 1
          }
        shell: pwsh
      # -------------------------------------------

      - name: Configure Rovergauge
        run: |
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"
        shell: pwsh
          
      - name: Build Rovergauge
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
          if (Test-Path "temp_libcomm/build/Release/comm14cux.dll") { Copy-Item "temp_libcomm/build/Release/comm14cux.dll" "build/Release/" }
          if (Test-Path "temp_libcomm/build/Release/libcomm14cux.dll") { Copy-Item "temp_libcomm/build/Release/libcomm14cux.dll" "build/Release/" }
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
