name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      # --- ИЗМЕНЕНИЕ: Скачиваем готовый релиз вместо сборки ---
      - name: Download libcomm14cux Release
        run: |
          Write-Host "Downloading pre-built libcomm14cux for Windows..."
          
          # Создаем папку для библиотеки
          $libPath = "libcomm14cux"
          New-Item -ItemType Directory -Force -Path $libPath | Out-Null
          
          # Ссылка на последний релиз (проверьте актуальную версию на GitHub releases)
          # Обычно это zip архив с dll и lib файлами
          $releaseUrl = "https://github.com/colinbourassa/libcomm14cux/releases/latest/download/libcomm14cux-Windows-x86_64.zip"
          
          # Попытка скачать. Если ссылка неверна, попробуем найти вручную или используем wget
          try {
            Invoke-WebRequest -Uri $releaseUrl -OutFile "libcomm.zip"
            Expand-Archive -Path "libcomm.zip" -DestinationPath $libPath -Force
            Write-Host "Downloaded and extracted successfully."
            
            # Перемещаем файлы в корень, если они в подпапке
            if (Test-Path "$libPath/bin/comm14cux.dll") {
               Copy-Item "$libPath/bin/*" -Destination "." -Force
               Copy-Item "$libPath/lib/*" -Destination "." -Force
            } elseif (Test-Path "$libPath/comm14cux.dll") {
               Copy-Item "$libPath/*" -Destination "." -Force
            }
          } catch {
            Write-Error "Failed to download release. Check the release URL on GitHub."
            exit 1
          }
        shell: pwsh
      # ---------------------------------------------------------

      # Копируем заголовки (они нужны в любом случае)
      - name: Copy Headers from Source
        run: |
          # Скачиваем исходники только ради заголовков, если их нет в релизе
          git clone --depth 1 https://github.com/colinbourassa/libcomm14cux.git temp_src
          if (Test-Path "temp_src/src/comm14cux.h") {
            Copy-Item "temp_src/src/*.h" -Destination "src" -Force
          }
          Remove-Item -Recurse -Force temp_src
        shell: pwsh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Rovergauge
        run: |
          # Теперь .lib и .dll файлы лежат в корне, CMake найдет их через find_library
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"
        shell: pwsh
          
      - name: Build Rovergauge
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
          # Копируем DLL библиотеки рядом с exe
          if (Test-Path "comm14cux.dll") { Copy-Item "comm14cux.dll" "build/Release/" }
          if (Test-Path "libcomm14cux.dll") { Copy-Item "libcomm14cux.dll" "build/Release/" }
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
