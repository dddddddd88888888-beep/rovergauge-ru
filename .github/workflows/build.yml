name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true
          # Важно: не устанавливаем dir вручную, чтобы действие само настроило переменные окружения

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        # Этот шаг явно активирует компилятор Visual Studio в консоли, что решает ошибку "not found"

      - name: Configure CMake
        run: |
          # Выводим путь для отладки
          Write-Host "Qt5_DIR is: $env:Qt5_DIR"
          # Используем Qt5_DIR вместо ручного пути, так как действие install-qt-action экспортирует его
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"
        shell: pwsh
          
      - name: Build Project
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error
