name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      # 1. Скачивание готовой библиотеки
      - name: Download libcomm14cux Binary
        run: |
          Write-Host "Downloading pre-built libcomm14cux..."
          $url = "https://github.com/colinbourassa/libcomm14cux/releases/download/2.1.3/libcomm14cux-2.1.3-Windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "libcomm.zip"
          Expand-Archive -Path "libcomm.zip" -DestinationPath "libcomm_bin" -Force
          
          # Выводим структуру папок для отладки
          Write-Host "Archive contents:"
          Get-ChildItem -Recurse "libcomm_bin"
          
          # Копируем все .lib и .dll файлы в корень рабочей директории
          Get-ChildItem -Path "libcomm_bin" -Recurse -Include "*.lib","*.dll" | Copy-Item -Destination "." -Force
          
          Write-Host "Files available in root:"
          Get-ChildItem -Filter "*.lib"
          Get-ChildItem -Filter "*.dll"
        shell: pwsh

      # 2. Получение заголовочного файла
      - name: Get Header File
        run: |
          git clone --depth 1 https://github.com/colinbourassa/libcomm14cux.git temp_src
          if (Test-Path "temp_src/src/comm14cux.h") {
            Copy-Item "temp_src/src/*.h" -Destination "src" -Force
          }
          Remove-Item -Recurse -Force temp_src
        shell: pwsh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Rovergauge
        run: |
          Write-Host "Configuring CMake..."
          # Явно указываем путь поиска библиотек в текущей папке, где лежат .lib файлы
          cmake -B build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR;${{ github.workspace }}" `
            -DCMAKE_LIBRARY_PATH="${{ github.workspace }}"
        shell: pwsh
          
      - name: Build Rovergauge
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
          # Копируем DLL рядом с exe
          Get-ChildItem -Filter "*.dll" | Copy-Item -Destination "build/Release/" -Force
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
