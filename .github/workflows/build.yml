name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Rovergauge Code
        uses: actions/checkout@v4

      # Скачиваем библиотеку libcomm14cux
      - name: Checkout libcomm14cux
        uses: actions/checkout@v4
        with:
          repository: colinbourassa/libcomm14cux
          path: libcomm14cux
          
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          Write-Host "Configuring CMake with explicit paths..."
          
          $qtPath = "$env:Qt5_DIR"
          $libcommPath = "${{ github.workspace }}/libcomm14cux"
          
          # 1. Ищем заголовочный файл, чтобы понять структуру папок
          $headerPath = ""
          if (Test-Path "$libcommPath/src/comm14cux.h") {
              $headerPath = "$libcommPath/src"
              Write-Host "Headers found in: /src"
          } elseif (Test-Path "$libcommPath/include/comm14cux.h") {
              $headerPath = "$libcommPath/include"
              Write-Host "Headers found in: /include"
          } elseif (Test-Path "$libcommPath/comm14cux.h") {
              $headerPath = "$libcommPath"
              Write-Host "Headers found in: root"
          } else {
              Write-Error "CRITICAL: comm14cux.h not found anywhere in libcomm14cux!"
              Get-ChildItem -Recurse -Path $libcommPath -Filter "*.h"
              exit 1
          }

          # 2. Ищем файл библиотеки (.lib или .dll) для find_library
          # В Windows MSVC обычно ищет .lib файлы для линковки
          $libDirPath = ""
          if (Test-Path "$libcommPath/Release/libcomm14cux.lib") {
              $libDirPath = "$libcommPath/Release"
              Write-Host "Library found in: /Release"
          } elseif (Test-Path "$libcommPath/libcomm14cux.lib") {
              $libDirPath = "$libcommPath"
              Write-Host "Library found in: root"
          } elseif (Test-Path "$libcommPath/libcomm14cux.dll") {
              # Если есть только DLL, указываем папку с ним, но сборка может упасть на линковке без .lib
              $libDirPath = "$libcommPath"
              Write-Host "Only DLL found. Warning: .lib file might be missing for linking."
          } else {
               Write-Warning "Binary library (.lib/.dll) not found in standard locations. CMake will search globally."
               $libDirPath = "$libcommPath"
          }

          Write-Host "Using Header Path: $headerPath"
          Write-Host "Using Library Path: $libDirPath"

          # 3. Запускаем CMake, передавая пути через переменные окружения CMAKE
          # CMAKE_INCLUDE_PATH поможет найти .h файлы
          # CMAKE_LIBRARY_PATH поможет find_library найти .lib/.dll файлы
          cmake -B build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$qtPath;$libcommPath" `
            -DCMAKE_INCLUDE_PATH="$headerPath" `
            -DCMAKE_LIBRARY_PATH="$libDirPath" `
            -DCMAKE_LIBRARY_PATH="$libDirPath;$qtPath/lib"
        shell: pwsh
          
      - name: Build Project
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
          # Копируем также libcomm14cux.dll если она есть в папке сборки или библиотеки
          if (Test-Path "libcomm14cux/libcomm14cux.dll") { Copy-Item "libcomm14cux/libcomm14cux.dll" "build/Release/" }
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
