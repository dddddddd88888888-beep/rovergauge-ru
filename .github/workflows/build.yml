name: Build Rovergauge EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: true

      # Инициализация среды MSVC без явного указания версии toolset
      # Это позволит использовать версию по умолчанию (VS2026 / v14.4+)
      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        # Параметр toolset удален, чтобы действие само выбрало доступную версию

      - name: Configure CMake
        run: |
          Write-Host "VSINSTALLDIR: $env:VSINSTALLDIR"
          Write-Host "Qt5_DIR: $env:Qt5_DIR"
          # Используем генератор Visual Studio 18 2026, так как на сервере установлена именно эта версия
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"
        shell: pwsh
          
      - name: Build Project
        run: cmake --build build --config Release
          
      - name: Deploy Qt Dependencies
        run: |
          & "$env:Qt5_DIR/bin/windeployqt.exe" --release build/Release/rovergauge.exe
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error
