name: Build Rovergauge EXE

on:
  workflow_dispatch:  # Позволяет запускать сборку вручную через кнопку
  push:               # Автоматический запуск при изменении кода

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      # 1. Скачивание исходного кода
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Установка Qt (версия 5.15.2 для MSVC 2019, совместимая с VS2022)
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          dir: ${{ github.workspace }}/Qt
          cache: true

      # 3. Настройка CMake
      # Используем переменную окружения Qt5_DIR, которую автоматически создает предыдущий шаг
      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ env.Qt5_DIR }}"
        shell: pwsh
          
      # 4. Сборка проекта (Режим Release)
      - name: Build Project
        run: |
          cmake --build build --config Release
          
      # 5. Копирование зависимостей Qt (DLL файлы)
      - name: Deploy Qt Dependencies
        run: |
          $qtBinPath = "${{ env.Qt5_DIR }}/bin"
          & "$qtBinPath/windeployqt.exe" --release build/Release/rovergauge.exe
        shell: pwsh

      # 6. Загрузка готового EXE и библиотек
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rovergauge-built
          path: build/Release/
          retention-days: 5
          if-no-files-found: error   
